name: Decision Literal Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  decision-literal-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run blocking literal gate
        run: python3 scripts/decision_literal_gate.py --blocking
      - name: Prove planted violations fail
        run: python3 tests/decision_literal_gate_proof.py
