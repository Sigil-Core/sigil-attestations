name: Decision Literal Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  decision-literal-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run advisory literal gate
        run: python3 scripts/decision_literal_gate.py
      - name: Prove planted violations fail
        run: python3 tests/decision_literal_gate_proof.py
