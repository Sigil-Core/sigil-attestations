name: Release immutable verifier candidate

on:
  push:
    tags:
      - "v*-rc.*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Pin and assert the package-manager contract
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-11.12.1" npm@11.12.1 --ignore-scripts
          export PATH="$RUNNER_TEMP/npm-11.12.1/node_modules/.bin:$PATH"
          test "$(node --version)" = v22.22.0
          test "$(npm --version)" = 11.12.1
          printf '%s\n' "$RUNNER_TEMP/npm-11.12.1/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:packed-cli
      - name: Require the tag to match package version and exact workflow commit
        run: |
          test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
      - id: package
        run: |
          npm pack
          package_file="$(find . -maxdepth 1 -name 'sigil-attestations-*.tgz' -print -quit)"
          test -n "$package_file"
          sha256sum "$package_file" > "${package_file}.sha256"
          printf 'package_file=%s\n' "$package_file" >> "$GITHUB_OUTPUT"
      - name: Upload tested candidate package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verifier-candidate-${{ github.ref_name }}
          path: |
            ${{ steps.package.outputs.package_file }}
            ${{ steps.package.outputs.package_file }}.sha256
            RELEASE-CANDIDATE.md
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download tested candidate package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verifier-candidate-${{ github.ref_name }}
          path: .
      - name: Attest immutable package artifact
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: sigil-attestations-*.tgz
      - name: Create immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" sigil-attestations-*.tgz
          sigil-attestations-*.tgz.sha256 --title "$GITHUB_REF_NAME"
          --notes-file RELEASE-CANDIDATE.md --verify-tag --prerelease

  publish:
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download tested candidate package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verifier-candidate-${{ github.ref_name }}
          path: .
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Require the npm trusted-publishing runtime
        run: |
          node --input-type=module -e "const [major, minor] = process.versions.node.split('.').map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)"
          node --input-type=module -e "const { execFileSync } = await import('node:child_process'); const [major, minor, patch] = execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim().split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1)"
      - name: Refuse an existing immutable npm version
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          package_version="${PACKAGE_VERSION#v}"
          if npm view "sigil-attestations@${package_version}" version --json > /tmp/npm-existing.json 2> /tmp/npm-view.err; then
            echo "npm version already exists: sigil-attestations@${package_version}"
            exit 1
          fi
          if ! grep -Eq "E404|404 Not Found" /tmp/npm-view.err; then
            cat /tmp/npm-view.err
            exit 1
          fi
      - name: Publish prerelease with npm trusted publishing and provenance
        run: |
          package_file="$(find . -maxdepth 1 -name 'sigil-attestations-*.tgz' -print -quit)"
          test -n "$package_file"
          npm publish "$package_file" --access public --tag next --provenance
